<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atrium Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: black;
  overflow: hidden;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: black;
}

.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.slide.active {
  opacity: 1;
}

/* Invisible edge zones */
.hover-zone {
  position: fixed;
  top: 0;
  width: 18%;
  height: 100%;
  z-index: 9;
}

.hover-zone.left {
  left: 0;
}

.hover-zone.right {
  right: 0;
}

/* Arrows hidden by default */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  width: 78px;
  height: 120px;
  border: none;
  border-radius: 18px;
  background: rgba(255,255,255,0.25);
  color: white;
  font-size: 62px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, background 0.25s ease;
}

.arrow-left {
  left: 24px;
}

.arrow-right {
  right: 24px;
}

/* Show only when hovering near the sides */
.hover-zone.left:hover ~ .arrow-left,
.arrow-left:hover {
  opacity: 0.55;
  pointer-events: auto;
}

.hover-zone.right:hover ~ .arrow-right,
.arrow-right:hover {
  opacity: 0.55;
  pointer-events: auto;
}

.arrow:hover {
  opacity: 0.9;
  background: rgba(255,255,255,0.42);
}

/* Hide arrows on touch-only screens */
@media (hover: none) {
  .arrow,
  .hover-zone {
    display: none;
  }
}
</style>
</head>

<body>

<div id="stage">
  <img id="imgA" class="slide active" alt="">
  <img id="imgB" class="slide" alt="">
</div>

<div class="hover-zone left"></div>
<div class="hover-zone right"></div>

<button class="arrow arrow-left" aria-label="Previous slide" onclick="manualAdvance(-1)">‹</button>
<button class="arrow arrow-right" aria-label="Next slide" onclick="manualAdvance(1)">›</button>

<script>
const SLIDE_FOLDER = "slides";
const EXT = "jpg";
const MAX_SLIDES = 60;
const SECONDS_PER_SLIDE = 15;
const FADE_SECONDS = 1.2;

const CACHE_TAG = new Date().toISOString().slice(0,10);

const imgA = document.getElementById("imgA");
const imgB = document.getElementById("imgB");

let current = null;
let front = imgA;
let back = imgB;
let isTransitioning = false;
let timer = null;

function slideUrl(n) {
  return `${SLIDE_FOLDER}/slide${n}.${EXT}?v=${CACHE_TAG}`;
}

function loadImage(img, url) {
  return new Promise(resolve => {
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function findSlide(direction = 1) {
  for (let step = 1; step <= MAX_SLIDES; step++) {
    let candidate;

    if (direction === 1) {
      candidate = ((current - 1 + step) % MAX_SLIDES) + 1;
    } else {
      candidate = ((current - 1 - step + MAX_SLIDES * 10) % MAX_SLIDES) + 1;
    }

    if (await loadImage(back, slideUrl(candidate))) {
      return candidate;
    }
  }

  return null;
}

async function advance(direction = 1) {
  if (isTransitioning || current === null) return;

  isTransitioning = true;

  const next = await findSlide(direction);

  if (next === null) {
    isTransitioning = false;
    return;
  }

  back.getBoundingClientRect();
  back.classList.add("active");
  front.classList.remove("active");

  setTimeout(() => {
    [front, back] = [back, front];
    current = next;
    isTransitioning = false;
  }, FADE_SECONDS * 1000 + 50);
}

function resetTimer() {
  clearInterval(timer);
  timer = setInterval(() => advance(1), SECONDS_PER_SLIDE * 1000);
}

function manualAdvance(direction) {
  advance(direction);
  resetTimer();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") manualAdvance(1);
  if (e.key === "ArrowLeft") manualAdvance(-1);
});

(async () => {
  for (let i = 1; i <= MAX_SLIDES; i++) {
    if (await loadImage(imgA, slideUrl(i))) {
      current = i;
      break;
    }
  }

  if (current === null) {
    console.warn("No slides found in /slides/");
    return;
  }

  resetTimer();
})();
</script>

</body>
</html>
