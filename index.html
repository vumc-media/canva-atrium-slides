<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<title>Atrium Slides</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<style>

html,
body {
  margin: 0;
  height: 100%;
  background: black;
  overflow: hidden;
}


#stage {
  position: fixed;
  inset: 0;
  background: black;
}


.slide {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  opacity: 0;

  transition:
    opacity 1.2s ease-in-out;
}


.slide.active {
  opacity: 1;
}


.hover-zone {
  position: fixed;
  top: 0;
  width: 18%;
  height: 100%;
  z-index: 9;
}


.hover-zone.left {
  left: 0;
}


.hover-zone.right {
  right: 0;
}


.arrow {
  position: fixed;
  top: 50%;

  transform:
    translateY(-50%);

  z-index: 10;

  width: 78px;
  height: 120px;

  border: none;

  border-radius: 18px;

  background:
    rgba(255,255,255,0.25);

  color: white;

  font-size: 62px;

  cursor: pointer;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.25s ease,
    background 0.25s ease;
}


.arrow-left {
  left: 24px;
}


.arrow-right {
  right: 24px;
}


.hover-zone.left:hover ~ .arrow-left,
.arrow-left:hover,
.hover-zone.right:hover ~ .arrow-right,
.arrow-right:hover {

  opacity: 0.55;

  pointer-events: auto;

}


.arrow:hover {

  opacity: 0.9;

  background:
    rgba(255,255,255,0.42);

}


@media (hover: none) {

  .arrow,
  .hover-zone {
    display: none;
  }

}

</style>

</head>


<body>


<div id="stage">

  <img
    id="imgA"
    class="slide active"
    alt="">

  <img
    id="imgB"
    class="slide"
    alt="">

</div>


<div class="hover-zone left"></div>

<div class="hover-zone right"></div>


<button
  class="arrow arrow-left"
  aria-label="Previous slide"
  onclick="manualAdvance(-1)">
  ‹
</button>


<button
  class="arrow arrow-right"
  aria-label="Next slide"
  onclick="manualAdvance(1)">
  ›
</button>



<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const SLIDE_FOLDER =
  "slides";

const CONFIG_FILE =
  "slides-config.json";

const SECONDS_PER_SLIDE =
  15;

const FADE_SECONDS =
  1.2;


const imgA =
  document.getElementById(
    "imgA"
  );

const imgB =
  document.getElementById(
    "imgB"
  );


let slideList =
  [];

let hiddenSlides =
  new Set();

let activeSlides =
  [];

let currentIndex =
  -1;

let front =
  imgA;

let back =
  imgB;

let isTransitioning =
  false;

let timer =
  null;



/* =====================================================
   LOAD MANIFEST
===================================================== */

async function loadConfig() {

  try {

    const response =
      await fetch(

        `${CONFIG_FILE}?v=${Date.now()}`,

        {
          cache:
            "no-store"
        }

      );


    if (
      !response.ok
    ) {

      throw new Error(
        `Config returned ${response.status}`
      );

    }


    const config =
      await response.json();


    slideList =
      Array.isArray(
        config.slides
      )

        ? config.slides

        : [];


    hiddenSlides =
      new Set(

        Array.isArray(
          config.hidden
        )

          ? config.hidden

          : []

      );


    activeSlides =
      slideList.filter(
        fileName =>
          !hiddenSlides.has(
            fileName
          )
      );


    return true;

  }

  catch (error) {

    console.error(
      "Unable to load slide manifest:",
      error
    );


    slideList =
      [];

    hiddenSlides =
      new Set();

    activeSlides =
      [];


    return false;

  }

}



/* =====================================================
   URL
===================================================== */

function slideUrl(
  fileName
) {

  return (

    `${SLIDE_FOLDER}/${encodeURIComponent(fileName)}?v=${Date.now()}`

  );

}



/* =====================================================
   IMAGE LOADER
===================================================== */

function loadImage(
  img,
  url
) {

  return new Promise(
    resolve => {


      img.onload =
        () =>
          resolve(
            true
          );


      img.onerror =
        () =>
          resolve(
            false
          );


      img.src =
        url;

    }
  );

}



/* =====================================================
   FIND NEXT LOADABLE SLIDE
===================================================== */

async function findNextSlide(
  direction
) {

  const total =
    activeSlides.length;


  if (
    total === 0
  ) {

    return null;

  }


  for (
    let step = 1;
    step <= total;
    step++
  ) {


    let candidateIndex;


    if (
      direction === 1
    ) {

      candidateIndex =
        (
          currentIndex +
          step
        ) %
        total;

    }

    else {

      candidateIndex =
        (
          currentIndex -
          step +
          total * 10
        ) %
        total;

    }


    const fileName =
      activeSlides[
        candidateIndex
      ];


    const loaded =
      await loadImage(

        back,

        slideUrl(
          fileName
        )

      );


    if (
      loaded
    ) {

      return {
        index:
          candidateIndex,

        fileName:
          fileName
      };

    }

  }


  return null;

}



/* =====================================================
   ADVANCE
===================================================== */

async function advance(
  direction = 1
) {

  if (
    isTransitioning
  ) {

    return;

  }


  isTransitioning =
    true;


  /*
    Reload manifest before each slide
    change so Hide / Show reaches an
    already-open Atrium display.
  */

  const currentFileName =

    currentIndex >= 0 &&
    currentIndex < activeSlides.length

      ? activeSlides[
          currentIndex
        ]

      : null;


  await loadConfig();


  /*
    Try to retain our place after the
    manifest reload.
  */

  if (
    currentFileName
  ) {

    const foundIndex =
      activeSlides.indexOf(
        currentFileName
      );


    currentIndex =
      foundIndex >= 0
        ? foundIndex
        : -1;

  }


  const next =
    await findNextSlide(
      direction
    );


  if (
    !next
  ) {

    isTransitioning =
      false;

    return;

  }


  back.getBoundingClientRect();


  back.classList.add(
    "active"
  );


  front.classList.remove(
    "active"
  );


  setTimeout(
    () => {


      [
        front,
        back
      ] =
        [
          back,
          front
        ];


      currentIndex =
        next.index;


      isTransitioning =
        false;


    },

    FADE_SECONDS *
      1000 +
      50

  );

}



/* =====================================================
   TIMER
===================================================== */

function resetTimer() {

  clearInterval(
    timer
  );


  timer =
    setInterval(

      () =>
        advance(1),

      SECONDS_PER_SLIDE *
        1000

    );

}



/* =====================================================
   MANUAL NAVIGATION
===================================================== */

function manualAdvance(
  direction
) {

  advance(
    direction
  );


  resetTimer();

}



/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(

  "keydown",

  event => {


    if (
      event.key ===
      "ArrowRight"
    ) {

      manualAdvance(
        1
      );

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      manualAdvance(
        -1
      );

    }

  }

);



/* =====================================================
   START
===================================================== */

(async () => {


  const loaded =
    await loadConfig();


  if (
    !loaded ||
    activeSlides.length === 0
  ) {

    console.warn(
      "No active Atrium slides found."
    );

    return;

  }


  /*
    Find the first image that
    successfully loads.
  */

  for (
    let i = 0;
    i < activeSlides.length;
    i++
  ) {


    const fileName =
      activeSlides[i];


    const success =
      await loadImage(

        imgA,

        slideUrl(
          fileName
        )

      );


    if (
      success
    ) {

      currentIndex =
        i;

      break;

    }

  }


  if (
    currentIndex === -1
  ) {

    console.warn(
      "No Atrium images could be loaded."
    );

    return;

  }


  resetTimer();


})();

</script>

</body>

</html>
