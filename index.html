<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atrium Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #atrium {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>

<body>

  <iframe
    id="atrium"
    src="https://www.canva.com/design/DAF1YVUBw4Q/gC-iJkQ37toRCkdIcPofyQ/view"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    // Reliability refresh:
    // Reload the Canva player every 6 hours in case PP7's web browser
    // or the Canva presentation gets stale.
    const REFRESH_HOURS = 6;

    setTimeout(() => {
      window.location.reload();
    }, REFRESH_HOURS * 60 * 60 * 1000);
  </script>

</body>
</html>
