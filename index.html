<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atrium Slides</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: black;
  overflow: hidden;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: black;
}

.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.active {
  opacity: 1;
}

/* ===== MANUAL ARROWS ===== */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  width: 70px;
  height: 110px;
  border: none;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.22);
  color: white;
  font-size: 58px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.2s ease, background 0.2s ease;
}

.arrow:hover {
  opacity: 0.9;
  background: rgba(255, 255, 255, 0.35);
}

.arrow-left {
  left: 24px;
}

.arrow-right {
  right: 24px;
}
</style>
</head>

<body>

<div id="stage">
  <img id="imgA" class="slide active" alt="">
  <img id="imgB" class="slide" alt="">
</div>

<button class="arrow arrow-left" onclick="manualAdvance(-1)">‹</button>
<button class="arrow arrow-right" onclick="manualAdvance(1)">›</button>

<script>
const SLIDE_FOLDER = "slides";
const EXT = "jpg";
const MAX_SLIDES = 60;
const SECONDS_PER_SLIDE = 15;
const FADE_SECONDS = 1.2;

const CACHE_TAG = new Date().toISOString().slice(0,10);

const imgA = document.getElementById("imgA");
const imgB = document.getElementById("imgB");

let current = null;
let front = imgA;
let back  = imgB;
let isTransitioning = false;
let timer = null;

function slideUrl(n) {
  return `${SLIDE_FOLDER}/slide${n}.${EXT}?v=${CACHE_TAG}`;
}

function loadImage(img, url) {
  return new Promise(resolve => {
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function findNextSlide(direction = 1) {
  for (let step = 1; step <= MAX_SLIDES; step++) {
    let candidate;

    if (direction === 1) {
      candidate = ((current - 1 + step) % MAX_SLIDES) + 1;
    } else {
      candidate = ((current - 1 - step + MAX_SLIDES * 10) % MAX_SLIDES) + 1;
    }

    if (await loadImage(back, slideUrl(candidate))) {
      return candidate;
    }
  }

  return null;
}

async function advance(direction = 1) {
  if (isTransitioning || current === null) return;

  isTransitioning = true;

  const next = await findNextSlide(direction);

  if (next === null) {
    isTransitioning = false;
    return;
  }

  back.getBoundingClientRect();
  back.classList.add("active");
  front.classList.remove("active");

  setTimeout(() => {
    [front, back] = [back, front];
    current = next;
    isTransitioning = false;
  }, FADE_SECONDS * 1000 + 50);
}

function resetTimer() {
  clearInterval(timer);
  timer = setInterval(() => advance(1), SECONDS_PER_SLIDE * 1000);
}

function manualAdvance(direction) {
  advance(direction);
  resetTimer();
}

(async () => {
  for (let i = 1; i <= MAX_SLIDES; i++) {
    if (await loadImage(imgA, slideUrl(i))) {
      current = i;
      break;
    }
  }

  if (current === null) {
    console.warn("No slides found in /slides/");
    return;
  }

  resetTimer();
})();
</script>

</body>
</html>
