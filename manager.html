<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VUMC Atrium Slide Manager</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #111;
  color: #fff;
}


/* =====================================================
   HEADER
===================================================== */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #181818;
  border-bottom: 1px solid #333;
  padding: 18px 24px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 24px;
}

header p {
  margin: 0;
  color: #aaa;
  font-size: 14px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
  align-items: center;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.primary {
  background: #fff;
  color: #111;
}

.danger {
  background: #d93025;
  color: #fff;
}

.success {
  background: #2e7d32;
  color: #fff;
}

.warning {
  background: #936b10;
  color: #fff;
}

.selected-count {
  margin-left: auto;
  padding: 11px 14px;
  background: #292929;
  border-radius: 8px;
  font-weight: 600;
}


/* =====================================================
   GITHUB CONNECTION
===================================================== */

.connection-area {
  padding: 14px 24px;
  background: #202020;
  border-bottom: 1px solid #333;
}

.connected-row,
.token-row {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 900px;
}

.connected-status {
  color: #7ee787;
  font-weight: 700;
}

input[type="password"] {
  flex: 1;
  padding: 11px 12px;
  border-radius: 8px;
  border: 1px solid #555;
  background: #111;
  color: white;
  font-size: 14px;
}


/* =====================================================
   UPLOAD
===================================================== */

.upload-section {
  padding: 22px 24px;
  border-bottom: 1px solid #333;
}

.upload-section h2 {
  margin: 0 0 12px;
  font-size: 20px;
}

.drop-zone {
  border: 2px dashed #666;
  border-radius: 14px;
  padding: 28px 20px;
  text-align: center;
  background: #181818;
  transition: .2s ease;
  cursor: pointer;
}

.drop-zone:hover {
  border-color: #999;
}

.drop-zone.dragover {
  border-color: #7ee787;
  background: #202820;
}

.drop-zone strong {
  display: block;
  font-size: 18px;
  margin-bottom: 6px;
}

.drop-zone span {
  color: #aaa;
  font-size: 14px;
}

#filePicker {
  display: none;
}

.upload-preview {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.upload-preview:empty {
  display: none;
}

.preview-card {
  background: #222;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #444;
}

.preview-card img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #000;
}

.preview-name {
  padding: 8px;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.upload-actions {
  display: none;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.upload-actions.visible {
  display: flex;
}

.upload-progress {
  margin-top: 12px;
  color: #aaa;
}


/* =====================================================
   LIVE STATUS
===================================================== */

.live-status {
  display: none;
  align-items: center;
  gap: 10px;
  margin-top: 15px;
  padding: 13px 15px;
  border-radius: 10px;
  font-weight: 700;
}

.live-status.waiting {
  display: flex;
  background: #332d16;
  color: #ffd866;
}

.live-status.live {
  display: flex;
  background: #17351f;
  color: #7ee787;
}

.live-status.error {
  display: flex;
  background: #3b1d1d;
  color: #ff8a80;
}

.status-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: currentColor;
  flex: 0 0 auto;
}

.live-status.waiting .status-dot {
  animation: pulse 1.2s infinite;
}

@keyframes pulse {

  0% {
    opacity: .35;
  }

  50% {
    opacity: 1;
  }

  100% {
    opacity: .35;
  }

}


/* =====================================================
   FILTERS
===================================================== */

.filter-area {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px 24px 10px;
}

.filter-button {
  background: #292929;
  color: #ddd;
  border: 1px solid #444;
}

.filter-button.active {
  background: #fff;
  color: #111;
  border-color: #fff;
}


/* =====================================================
   STATUS
===================================================== */

#status {
  padding: 8px 24px 16px;
  color: #bbb;
}


/* =====================================================
   SLIDES
===================================================== */

#grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(270px, 1fr));
  gap: 18px;
  padding: 0 24px 40px;
}

.card {
  position: relative;
  background: #1c1c1c;
  border: 2px solid transparent;
  border-radius: 12px;
  overflow: hidden;
  transition: .15s ease;
}

.card:hover {
  transform: translateY(-2px);
  border-color: #666;
}

.card.selected {
  border-color: #ff5252;
}

.card.hidden-slide {
  border-color: #705f28;
}

.image-wrap {
  position: relative;
  background: #000;
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #000;
}

.card.hidden-slide img {
  opacity: .34;
}

.hidden-overlay {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.card.hidden-slide .hidden-overlay {
  display: flex;
}

.hidden-overlay span {
  background: rgba(0,0,0,.8);
  border: 1px solid #d3ae3f;
  color: #ffd866;
  border-radius: 8px;
  padding: 9px 15px;
  font-weight: 800;
  letter-spacing: 1px;
}

.info {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px 8px;
}

.info input {
  width: 20px;
  height: 20px;
  cursor: pointer;
}

.filename {
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.state-badge {
  font-size: 11px;
  font-weight: 800;
  border-radius: 20px;
  padding: 5px 8px;
  white-space: nowrap;
}

.state-badge.active {
  color: #7ee787;
  background: #17351f;
}

.state-badge.hidden {
  color: #ffd866;
  background: #332d16;
}

.card-actions {
  display: flex;
  gap: 8px;
  padding: 4px 12px 12px;
}

.card-actions button {
  flex: 1;
  padding: 9px 10px;
  font-size: 13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  .token-row,
  .connected-row {
    flex-direction: column;
    align-items: stretch;
  }

  .selected-count {
    margin-left: 0;
  }

  #grid {
    grid-template-columns: 1fr;
    padding-left: 12px;
    padding-right: 12px;
  }

  header,
  .connection-area,
  .upload-section,
  .filter-area,
  #status {
    padding-left: 14px;
    padding-right: 14px;
  }

}

</style>

</head>


<body>


<header>

  <h1>
    VUMC Atrium Slide Manager
  </h1>

  <p>
    Upload, hide, show, and remove Atrium announcements.
  </p>


  <div class="toolbar">

    <button
      class="primary"
      onclick="selectAllVisible()">
      Select Visible
    </button>

    <button
      class="primary"
      onclick="clearSelection()">
      Clear Selection
    </button>

    <button
      id="deleteButton"
      class="danger"
      onclick="deleteSelected()"
      disabled>
      Delete Selected
    </button>

    <button
      class="primary"
      onclick="loadEverything()">
      Refresh
    </button>

    <div class="selected-count">
      <span id="count">0</span> selected
    </div>

  </div>

</header>



<!-- GITHUB CONNECTION -->

<div class="connection-area">

  <div
    id="connectedRow"
    class="connected-row"
    style="display:none;">

    <span class="connected-status">
      ✓ GitHub Connected
    </span>

    <button
      class="primary"
      onclick="showTokenBox()">
      Change Token
    </button>

  </div>


  <div
    id="tokenRow"
    class="token-row">

    <input
      id="token"
      type="password"
      placeholder="GitHub Personal Access Token">

    <button
      class="primary"
      onclick="saveToken()">
      Save Token
    </button>

  </div>

</div>



<!-- UPLOAD -->

<section class="upload-section">

  <h2>
    Add / Replace Slides
  </h2>

  <div
    id="dropZone"
    class="drop-zone"
    onclick="document.getElementById('filePicker').click()">

    <strong>
      Drop Canva JPGs here
    </strong>

    <span>
      Filenames no longer have to be sequential.
    </span>

  </div>


  <input
    id="filePicker"
    type="file"
    accept=".jpg,.jpeg,.png,.webp"
    multiple>


  <div
    id="uploadPreview"
    class="upload-preview">
  </div>


  <div
    id="uploadActions"
    class="upload-actions">

    <button
      id="uploadButton"
      class="success"
      onclick="uploadFiles()">
      Upload to Atrium
    </button>

    <button
      class="primary"
      onclick="clearUploadQueue()">
      Cancel
    </button>

  </div>


  <div
    id="uploadProgress"
    class="upload-progress">
  </div>


  <div
    id="liveStatus"
    class="live-status">

    <span class="status-dot"></span>

    <span id="liveStatusText">
      Checking Atrium...
    </span>

  </div>

</section>



<!-- FILTERS -->

<div class="filter-area">

  <button
    id="filterAll"
    class="filter-button active"
    onclick="setFilter('all')">
    All
  </button>

  <button
    id="filterActive"
    class="filter-button"
    onclick="setFilter('active')">
    Active
  </button>

  <button
    id="filterHidden"
    class="filter-button"
    onclick="setFilter('hidden')">
    Hidden
  </button>

</div>


<div id="status">
  Loading slides...
</div>


<div id="grid"></div>



<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const OWNER =
  "vumc-media";

const REPO =
  "canva-atrium-slides";

const BRANCH =
  "main";

const FOLDER =
  "slides";

const CONFIG_PATH =
  "slides-config.json";

const ATRIUM_URL =
  "https://canvaslides.netlify.app";

const API =
  `https://api.github.com/repos/${OWNER}/${REPO}`;


let files =
  [];

let selected =
  new Set();

let uploadQueue =
  [];

let hiddenSlides =
  new Set();

let manifestSlides =
  [];

let configSha =
  null;

let configHadSlideList =
  false;

let currentFilter =
  "all";



/* =====================================================
   TOKEN
===================================================== */

function getToken() {

  return localStorage.getItem(
    "atriumGithubToken"
  );

}


function saveToken() {

  const token =
    document
      .getElementById("token")
      .value
      .trim();


  if (!token) {

    alert(
      "Enter your GitHub token first."
    );

    return;

  }


  localStorage.setItem(
    "atriumGithubToken",
    token
  );


  document.getElementById(
    "token"
  ).value =
    "";


  updateConnectionUI();


  loadEverything();

}


function showTokenBox() {

  document.getElementById(
    "connectedRow"
  ).style.display =
    "none";


  document.getElementById(
    "tokenRow"
  ).style.display =
    "flex";

}


function updateConnectionUI() {

  const token =
    getToken();


  document.getElementById(
    "connectedRow"
  ).style.display =
    token
      ? "flex"
      : "none";


  document.getElementById(
    "tokenRow"
  ).style.display =
    token
      ? "none"
      : "flex";

}


function authorizationFailed() {

  localStorage.removeItem(
    "atriumGithubToken"
  );


  updateConnectionUI();


  alert(
    "GitHub authorization has expired or is no longer valid. Enter a new token to reconnect."
  );

}



/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


function setLiveStatus(
  type,
  message
) {

  const box =
    document.getElementById(
      "liveStatus"
    );


  const text =
    document.getElementById(
      "liveStatusText"
    );


  box.className =
    `live-status ${type}`;


  text.textContent =
    message;

}



/* =====================================================
   HELPERS
===================================================== */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


function naturalNameSort(
  a,
  b
) {

  return a.localeCompare(
    b,
    undefined,
    {
      numeric: true,
      sensitivity: "base"
    }
  );

}


function naturalFileSort(
  a,
  b
) {

  return naturalNameSort(
    a.name,
    b.name
  );

}


function encodeBase64Utf8(text) {

  const bytes =
    new TextEncoder()
      .encode(text);


  let binary =
    "";


  bytes.forEach(
    byte => {
      binary +=
        String.fromCharCode(byte);
    }
  );


  return btoa(
    binary
  );

}


function decodeBase64Utf8(base64) {

  const binary =
    atob(
      base64.replace(/\n/g, "")
    );


  const bytes =
    Uint8Array.from(
      binary,
      char =>
        char.charCodeAt(0)
    );


  return new TextDecoder()
    .decode(bytes);

}



/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadEverything() {

  setStatus(
    "Loading slides..."
  );


  selected.clear();

  updateSelection();


  await loadConfig();

  await loadSlides();


  /*
    The GitHub slides folder is the
    source of truth for what exists.

    Rebuild the manifest from the real
    files so unusual filenames are
    included automatically.
  */

  const actualNames =
    files
      .map(
        file =>
          file.name
      )
      .sort(
        naturalNameSort
      );


  /*
    Remove hidden names for files that
    no longer exist.
  */

  const actualNameSet =
    new Set(
      actualNames
    );


  hiddenSlides =
    new Set(

      Array.from(
        hiddenSlides
      )
      .filter(
        name =>
          actualNameSet.has(
            name
          )
      )

    );


  const oldManifest =
    [...manifestSlides]
      .sort(
        naturalNameSort
      );


  manifestSlides =
    actualNames;


  renderSlides();


  /*
    Automatically upgrade the old
    hidden-only config to the new
    manifest config.

    This also repairs the manifest if
    the GitHub folder changed.
  */

  const manifestChanged =

    !configHadSlideList ||

    JSON.stringify(
      oldManifest
    ) !==
    JSON.stringify(
      actualNames
    );


  if (
    manifestChanged &&
    getToken()
  ) {

    const saved =
      await saveConfig(
        "Sync Atrium slide manifest"
      );


    if (
      saved
    ) {

      setLiveStatus(
        "waiting",
        "Slide list updated — Atrium updating..."
      );


      await waitForConfigDeployment();

    }

  }

}



/* =====================================================
   LOAD CONFIG
===================================================== */

async function loadConfig() {

  hiddenSlides =
    new Set();

  manifestSlides =
    [];

  configSha =
    null;

  configHadSlideList =
    false;


  try {

    const response =
      await fetch(

        `${API}/contents/${CONFIG_PATH}?ref=${BRANCH}&v=${Date.now()}`,

        {
          cache:
            "no-store",

          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }

      );


    if (
      response.status === 404
    ) {

      return;

    }


    if (
      !response.ok
    ) {

      throw new Error(
        `Config returned ${response.status}`
      );

    }


    const data =
      await response.json();


    configSha =
      data.sha;


    const text =
      decodeBase64Utf8(
        data.content
      );


    const config =
      JSON.parse(
        text
      );


    if (
      Array.isArray(
        config.hidden
      )
    ) {

      hiddenSlides =
        new Set(
          config.hidden
        );

    }


    if (
      Array.isArray(
        config.slides
      )
    ) {

      manifestSlides =
        [...config.slides];


      configHadSlideList =
        true;

    }

  }

  catch (error) {

    console.error(
      "Unable to load slide config:",
      error
    );

  }

}



/* =====================================================
   SAVE CONFIG / MANIFEST
===================================================== */

async function saveConfig(
  commitMessage
) {

  const token =
    getToken();


  if (!token) {

    showTokenBox();


    alert(
      "Enter your GitHub token first."
    );


    return false;

  }


  const config = {

    slides:
      [...manifestSlides]
        .sort(
          naturalNameSort
        ),

    hidden:
      Array.from(
        hiddenSlides
      )
      .sort(
        naturalNameSort
      )

  };


  const payload = {

    message:
      commitMessage,

    content:
      encodeBase64Utf8(

        JSON.stringify(
          config,
          null,
          2
        ) + "\n"

      ),

    branch:
      BRANCH

  };


  if (
    configSha
  ) {

    payload.sha =
      configSha;

  }


  try {

    const response =
      await fetch(

        `${API}/contents/${CONFIG_PATH}`,

        {

          method:
            "PUT",

          headers: {

            "Authorization":
              `Bearer ${token}`,

            "Accept":
              "application/vnd.github+json",

            "Content-Type":
              "application/json",

            "X-GitHub-Api-Version":
              "2022-11-28"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    if (
      response.status === 401 ||
      response.status === 403
    ) {

      authorizationFailed();

      return false;

    }


    if (
      !response.ok
    ) {

      console.error(
        await response.text()
      );


      alert(
        "GitHub could not update the Atrium slide list."
      );


      return false;

    }


    const result =
      await response.json();


    if (
      result.content &&
      result.content.sha
    ) {

      configSha =
        result.content.sha;

    }


    configHadSlideList =
      true;


    return true;

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "Unable to update the Atrium slide list."
    );


    return false;

  }

}



/* =====================================================
   LOAD SLIDES DIRECTORY
===================================================== */

async function loadSlides() {

  try {

    const response =
      await fetch(

        `${API}/contents/${FOLDER}?ref=${BRANCH}&v=${Date.now()}`,

        {
          cache:
            "no-store",

          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }

      );


    if (
      !response.ok
    ) {

      throw new Error(
        `GitHub returned ${response.status}`
      );

    }


    const data =
      await response.json();


    files =
      data

        .filter(
          file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp)$/i
              .test(
                file.name
              )
        )

        .sort(
          naturalFileSort
        );

  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      "Unable to load the slides folder."
    );

  }

}



/* =====================================================
   FILTERS
===================================================== */

function setFilter(
  filter
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  const id =

    filter === "all"
      ? "filterAll"

      : filter === "active"
        ? "filterActive"

        : "filterHidden";


  document.getElementById(
    id
  ).classList.add(
    "active"
  );


  renderSlides();

}


function getVisibleFiles() {

  if (
    currentFilter === "active"
  ) {

    return files.filter(
      file =>
        !hiddenSlides.has(
          file.name
        )
    );

  }


  if (
    currentFilter === "hidden"
  ) {

    return files.filter(
      file =>
        hiddenSlides.has(
          file.name
        )
    );

  }


  return files;

}



/* =====================================================
   RENDER SLIDES
===================================================== */

function renderSlides() {

  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML =
    "";


  const visibleFiles =
    getVisibleFiles();


  const activeCount =
    files.filter(
      file =>
        !hiddenSlides.has(
          file.name
        )
    ).length;


  const hiddenCount =
    files.filter(
      file =>
        hiddenSlides.has(
          file.name
        )
    ).length;


  setStatus(

    `${files.length} slides — ${activeCount} active, ${hiddenCount} hidden.`

  );


  visibleFiles.forEach(
    file => {


      const isHidden =
        hiddenSlides.has(
          file.name
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        isHidden
          ? "card hidden-slide"
          : "card";


      card.dataset.path =
        file.path;



      const imageWrap =
        document.createElement(
          "div"
        );


      imageWrap.className =
        "image-wrap";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        `${file.download_url}?v=${Date.now()}`;


      image.alt =
        file.name;


      const overlay =
        document.createElement(
          "div"
        );


      overlay.className =
        "hidden-overlay";


      const overlayText =
        document.createElement(
          "span"
        );


      overlayText.textContent =
        "HIDDEN";


      overlay.appendChild(
        overlayText
      );


      imageWrap.appendChild(
        image
      );


      imageWrap.appendChild(
        overlay
      );



      const info =
        document.createElement(
          "div"
        );


      info.className =
        "info";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.checked =
        selected.has(
          file.path
        );


      checkbox.onchange =
        function() {

          toggleFile(
            file.path
          );

        };


      const filename =
        document.createElement(
          "div"
        );


      filename.className =
        "filename";


      filename.textContent =
        file.name;


      const badge =
        document.createElement(
          "span"
        );


      badge.className =
        isHidden
          ? "state-badge hidden"
          : "state-badge active";


      badge.textContent =
        isHidden
          ? "HIDDEN"
          : "ACTIVE";


      info.appendChild(
        checkbox
      );


      info.appendChild(
        filename
      );


      info.appendChild(
        badge
      );



      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "card-actions";


      const visibilityButton =
        document.createElement(
          "button"
        );


      visibilityButton.className =
        isHidden
          ? "success"
          : "warning";


      visibilityButton.textContent =
        isHidden
          ? "Show"
          : "Hide";


      visibilityButton.onclick =
        function() {

          if (
            isHidden
          ) {

            showSlide(
              file.name
            );

          }

          else {

            hideSlide(
              file.name
            );

          }

        };


      actions.appendChild(
        visibilityButton
      );


      card.appendChild(
        imageWrap
      );


      card.appendChild(
        info
      );


      card.appendChild(
        actions
      );


      grid.appendChild(
        card
      );

    }

  );


  updateSelection();

}



/* =====================================================
   SELECTION
===================================================== */

function toggleFile(
  path
) {

  if (
    selected.has(
      path
    )
  ) {

    selected.delete(
      path
    );

  }

  else {

    selected.add(
      path
    );

  }


  updateSelection();

}


function selectAllVisible() {

  getVisibleFiles()
    .forEach(
      file =>
        selected.add(
          file.path
        )
    );


  updateSelection();

}


function clearSelection() {

  selected.clear();


  updateSelection();

}


function updateSelection() {

  document.getElementById(
    "count"
  ).textContent =
    selected.size;


  document.getElementById(
    "deleteButton"
  ).disabled =
    selected.size === 0;


  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {


        const checkbox =
          card.querySelector(
            'input[type="checkbox"]'
          );


        if (
          checkbox
        ) {

          checkbox.checked =
            selected.has(
              card.dataset.path
            );

        }

      }
    );

}



/* =====================================================
   HIDE
===================================================== */

async function hideSlide(
  fileName
) {

  if (
    hiddenSlides.has(
      fileName
    )
  ) {

    return;

  }


  hiddenSlides.add(
    fileName
  );


  renderSlides();


  setLiveStatus(
    "waiting",
    "Hiding slide — Atrium updating..."
  );


  const saved =
    await saveConfig(
      `Hide Atrium slide ${fileName}`
    );


  if (
    !saved
  ) {

    hiddenSlides.delete(
      fileName
    );


    renderSlides();


    return;

  }


  await waitForConfigDeployment();

}



/* =====================================================
   SHOW
===================================================== */

async function showSlide(
  fileName
) {

  if (
    !hiddenSlides.has(
      fileName
    )
  ) {

    return;

  }


  hiddenSlides.delete(
    fileName
  );


  renderSlides();


  setLiveStatus(
    "waiting",
    "Showing slide — Atrium updating..."
  );


  const saved =
    await saveConfig(
      `Show Atrium slide ${fileName}`
    );


  if (
    !saved
  ) {

    hiddenSlides.add(
      fileName
    );


    renderSlides();


    return;

  }


  await waitForConfigDeployment();

}



/* =====================================================
   DELETE
===================================================== */

async function deleteSelected() {

  const token =
    getToken();


  if (
    !token
  ) {

    showTokenBox();


    alert(
      "Enter your GitHub token first."
    );


    return;

  }


  const selectedFiles =
    files.filter(
      file =>
        selected.has(
          file.path
        )
    );


  if (
    !selectedFiles.length
  ) {

    return;

  }


  const names =
    selectedFiles
      .map(
        file =>
          file.name
      )
      .join("\n");


  const confirmed =
    confirm(

      `Permanently delete ${selectedFiles.length} slide(s)?\n\n${names}\n\nUse Hide instead for slides you may reuse.`

    );


  if (
    !confirmed
  ) {

    return;

  }


  let deleted =
    0;

  let failed =
    0;


  for (
    const file of selectedFiles
  ) {


    setStatus(
      `Deleting ${file.name}...`
    );


    try {

      const response =
        await fetch(

          `${API}/contents/${file.path}`,

          {

            method:
              "DELETE",

            headers: {

              "Authorization":
                `Bearer ${token}`,

              "Accept":
                "application/vnd.github+json",

              "Content-Type":
                "application/json",

              "X-GitHub-Api-Version":
                "2022-11-28"

            },

            body:
              JSON.stringify({

                message:
                  `Delete Atrium slide ${file.name}`,

                sha:
                  file.sha,

                branch:
                  BRANCH

              })

          }

        );


      if (
        response.status === 401 ||
        response.status === 403
      ) {

        authorizationFailed();

        return;

      }


      if (
        !response.ok
      ) {

        console.error(
          file.name,
          await response.text()
        );


        failed++;

      }

      else {

        deleted++;


        hiddenSlides.delete(
          file.name
        );


        manifestSlides =
          manifestSlides.filter(
            name =>
              name !==
              file.name
          );

      }

    }

    catch (error) {

      console.error(
        error
      );


      failed++;

    }

  }


  if (
    deleted > 0
  ) {

    await saveConfig(
      "Update Atrium manifest after deleting slides"
    );

  }


  selected.clear();


  await loadSlides();


  manifestSlides =
    files
      .map(
        file =>
          file.name
      )
      .sort(
        naturalNameSort
      );


  renderSlides();


  if (
    failed > 0
  ) {

    alert(
      `${deleted} deleted. ${failed} failed.`
    );

  }

  else {

    setLiveStatus(
      "waiting",
      "Slides deleted — Atrium updating..."
    );


    await waitForConfigDeployment();

  }

}



/* =====================================================
   DRAG / DROP
===================================================== */

const dropZone =
  document.getElementById(
    "dropZone"
  );


const filePicker =
  document.getElementById(
    "filePicker"
  );


[
  "dragenter",
  "dragover"
]
.forEach(
  eventName => {


    dropZone.addEventListener(

      eventName,

      event => {

        event.preventDefault();

        event.stopPropagation();


        dropZone.classList.add(
          "dragover"
        );

      }

    );

  }
);


[
  "dragleave",
  "drop"
]
.forEach(
  eventName => {


    dropZone.addEventListener(

      eventName,

      event => {

        event.preventDefault();

        event.stopPropagation();


        dropZone.classList.remove(
          "dragover"
        );

      }

    );

  }
);


dropZone.addEventListener(

  "drop",

  event => {

    addUploadFiles(
      event.dataTransfer.files
    );

  }

);


filePicker.addEventListener(

  "change",

  event => {

    addUploadFiles(
      event.target.files
    );


    filePicker.value =
      "";

  }

);



/* =====================================================
   UPLOAD QUEUE
===================================================== */

function addUploadFiles(
  fileList
) {

  const incoming =
    Array.from(
      fileList
    )
    .filter(
      file =>
        /\.(jpg|jpeg|png|webp)$/i
          .test(
            file.name
          )
    );


  if (
    !incoming.length
  ) {

    alert(
      "No JPG, PNG, or WebP images were found."
    );


    return;

  }


  incoming.forEach(
    file => {


      const existingIndex =
        uploadQueue.findIndex(

          queued =>
            queued.name.toLowerCase() ===
            file.name.toLowerCase()

        );


      if (
        existingIndex >= 0
      ) {

        uploadQueue[
          existingIndex
        ] =
          file;

      }

      else {

        uploadQueue.push(
          file
        );

      }

    }

  );


  uploadQueue.sort(
    (
      a,
      b
    ) =>
      naturalNameSort(
        a.name,
        b.name
      )
  );


  renderUploadPreview();

}



/* =====================================================
   PREVIEW
===================================================== */

function renderUploadPreview() {

  const preview =
    document.getElementById(
      "uploadPreview"
    );


  preview.innerHTML =
    "";


  uploadQueue.forEach(
    file => {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "preview-card";


      const img =
        document.createElement(
          "img"
        );


      const objectURL =
        URL.createObjectURL(
          file
        );


      img.src =
        objectURL;


      img.onload =
        () =>
          URL.revokeObjectURL(
            objectURL
          );


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "preview-name";


      name.textContent =
        file.name;


      card.appendChild(
        img
      );


      card.appendChild(
        name
      );


      preview.appendChild(
        card
      );

    }

  );


  document.getElementById(
    "uploadActions"
  )
  .classList.toggle(

    "visible",

    uploadQueue.length > 0

  );


  document.getElementById(
    "uploadProgress"
  ).textContent =

    uploadQueue.length

      ? `${uploadQueue.length} image(s) ready to upload.`

      : "";

}



/* =====================================================
   CLEAR QUEUE
===================================================== */

function clearUploadQueue() {

  uploadQueue =
    [];


  renderUploadPreview();

}



/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(
  file
) {

  return new Promise(

    (
      resolve,
      reject
    ) => {


      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            reader.result
              .split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }

  );

}



/* =====================================================
   SHA256
===================================================== */

async function sha256Blob(
  blob
) {

  const buffer =
    await blob.arrayBuffer();


  const digest =
    await crypto.subtle.digest(
      "SHA-256",
      buffer
    );


  return Array.from(
    new Uint8Array(
      digest
    )
  )
  .map(
    byte =>
      byte
        .toString(16)
        .padStart(
          2,
          "0"
        )
  )
  .join("");

}



/* =====================================================
   FIND EXISTING FILE
===================================================== */

function findExistingFile(
  name
) {

  return files.find(

    file =>
      file.name.toLowerCase() ===
      name.toLowerCase()

  );

}



/* =====================================================
   UPLOAD
===================================================== */

async function uploadFiles() {

  const token =
    getToken();


  if (
    !token
  ) {

    showTokenBox();


    alert(
      "Enter your GitHub token first."
    );


    return;

  }


  if (
    !uploadQueue.length
  ) {

    return;

  }


  const confirmed =
    confirm(

      `Upload ${uploadQueue.length} image(s) to the Atrium?\n\nMatching filenames will be replaced. Hidden slides remain hidden.`

    );


  if (
    !confirmed
  ) {

    return;

  }


  const uploadButton =
    document.getElementById(
      "uploadButton"
    );


  uploadButton.disabled =
    true;


  const filesBeingUploaded =
    [...uploadQueue];


  let completed =
    0;

  let failed =
    0;


  for (
    const file of filesBeingUploaded
  ) {


    document.getElementById(
      "uploadProgress"
    ).textContent =

      `Uploading ${file.name} (${completed + failed + 1} of ${filesBeingUploaded.length})...`;


    try {


      const content =
        await fileToBase64(
          file
        );


      const existing =
        findExistingFile(
          file.name
        );


      const payload = {

        message:
          existing

            ? `Update Atrium slide ${file.name}`

            : `Add Atrium slide ${file.name}`,

        content:
          content,

        branch:
          BRANCH

      };


      if (
        existing
      ) {

        payload.sha =
          existing.sha;

      }


      const response =
        await fetch(

          `${API}/contents/${FOLDER}/${encodeURIComponent(file.name)}`,

          {

            method:
              "PUT",

            headers: {

              "Authorization":
                `Bearer ${token}`,

              "Accept":
                "application/vnd.github+json",

              "Content-Type":
                "application/json",

              "X-GitHub-Api-Version":
                "2022-11-28"

            },

            body:
              JSON.stringify(
                payload
              )

          }

        );


      if (
        response.status === 401 ||
        response.status === 403
      ) {

        authorizationFailed();


        uploadButton.disabled =
          false;


        return;

      }


      if (
        !response.ok
      ) {

        console.error(
          file.name,
          await response.text()
        );


        failed++;

      }

      else {

        completed++;

      }

    }

    catch (error) {

      console.error(
        error
      );


      failed++;

    }

  }


  uploadButton.disabled =
    false;


  uploadQueue =
    [];


  renderUploadPreview();


  /*
    Reload the folder after uploading,
    then create the manifest from every
    real image that now exists.
  */

  await loadSlides();


  manifestSlides =
    files
      .map(
        file =>
          file.name
      )
      .sort(
        naturalNameSort
      );


  const actualNameSet =
    new Set(
      manifestSlides
    );


  hiddenSlides =
    new Set(

      Array.from(
        hiddenSlides
      )
      .filter(
        name =>
          actualNameSet.has(
            name
          )
      )

    );


  await saveConfig(
    "Update Atrium slide manifest"
  );


  renderSlides();


  if (
    failed > 0
  ) {

    document.getElementById(
      "uploadProgress"
    ).textContent =

      `${completed} uploaded. ${failed} failed.`;


    alert(
      `${completed} image(s) uploaded. ${failed} failed.`
    );


    return;

  }


  document.getElementById(
    "uploadProgress"
  ).textContent =

    `${completed} image(s) uploaded successfully.`;


  setLiveStatus(
    "waiting",
    "Slides uploaded — Atrium updating..."
  );


  await waitForAtriumFile(
    filesBeingUploaded[0]
  );

}



/* =====================================================
   VERIFY UPLOAD ON NETLIFY
===================================================== */

async function waitForAtriumFile(
  uploadedFile
) {

  let localHash;


  try {

    localHash =
      await sha256Blob(
        uploadedFile
      );

  }

  catch (error) {

    console.error(
      error
    );


    setLiveStatus(
      "error",
      "Upload succeeded, but live verification could not start."
    );


    return;

  }


  await sleep(
    4000
  );


  const maxChecks =
    30;


  for (
    let attempt = 1;
    attempt <= maxChecks;
    attempt++
  ) {


    try {

      const response =
        await fetch(

          `${ATRIUM_URL}/slides/${encodeURIComponent(uploadedFile.name)}?deploycheck=${Date.now()}`,

          {
            cache:
              "no-store"
          }

        );


      if (
        response.ok
      ) {

        const liveBlob =
          await response.blob();


        const liveHash =
          await sha256Blob(
            liveBlob
          );


        if (
          liveHash ===
          localHash
        ) {

          /*
            The image is live. Also make
            sure the manifest itself has
            arrived.
          */

          await waitForConfigDeployment();


          return;

        }

      }

    }

    catch (error) {

      console.log(
        "Waiting for Atrium...",
        error
      );

    }


    setLiveStatus(
      "waiting",
      `Atrium updating... check ${attempt} of ${maxChecks}`
    );


    await sleep(
      4000
    );

  }


  setLiveStatus(
    "error",
    "Upload succeeded, but the live Atrium update could not be confirmed yet."
  );

}



/* =====================================================
   VERIFY MANIFEST ON NETLIFY
===================================================== */

async function waitForConfigDeployment() {

  const expectedSlides =
    [...manifestSlides]
      .sort(
        naturalNameSort
      );


  const expectedHidden =
    Array.from(
      hiddenSlides
    )
      .sort(
        naturalNameSort
      );


  await sleep(
    3000
  );


  const maxChecks =
    30;


  for (
    let attempt = 1;
    attempt <= maxChecks;
    attempt++
  ) {


    try {

      const response =
        await fetch(

          `${ATRIUM_URL}/${CONFIG_PATH}?deploycheck=${Date.now()}`,

          {
            cache:
              "no-store"
          }

        );


      if (
        response.ok
      ) {

        const config =
          await response.json();


        const liveSlides =
          Array.isArray(
            config.slides
          )

            ? [...config.slides]
                .sort(
                  naturalNameSort
                )

            : [];


        const liveHidden =
          Array.isArray(
            config.hidden
          )

            ? [...config.hidden]
                .sort(
                  naturalNameSort
                )

            : [];


        if (

          JSON.stringify(
            liveSlides
          ) ===
          JSON.stringify(
            expectedSlides
          )

          &&

          JSON.stringify(
            liveHidden
          ) ===
          JSON.stringify(
            expectedHidden
          )

        ) {

          setLiveStatus(
            "live",
            "✓ Atrium is live with the current slide list"
          );


          return true;

        }

      }

    }

    catch (error) {

      console.log(
        "Waiting for Atrium manifest...",
        error
      );

    }


    setLiveStatus(
      "waiting",
      `Atrium updating... check ${attempt} of ${maxChecks}`
    );


    await sleep(
      4000
    );

  }


  setLiveStatus(
    "error",
    "GitHub updated, but the Atrium deployment could not be confirmed yet."
  );


  return false;

}
